; Sample supervisord program for teams-sip-blf (sip-blf-sync).
;
; Install (pick one path for your distro):
;   RHEL/CentOS/Rocky:  /etc/supervisord.d/teams-sip-blf.ini
;   Debian/Ubuntu:      /etc/supervisor/conf.d/teams-sip-blf.conf
;
; Expected layout:
;   /opt/teams-sip-blf/
;     bin/sip-blf-sync              # release binary renamed from sip-blf-sync-linux-amd64
;     .env                          # copy from .env.example (chmod 600)
;     config/extensions.json
;     config/presence-state.json
;
; Then:
;   mkdir -p /var/log/teams-sip-blf
;   supervisorctl reread && supervisorctl update
;   supervisorctl start teams-sip-blf

[program:teams-sip-blf]
command=/opt/teams-sip-blf/bin/sip-blf-sync
directory=/opt/teams-sip-blf
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stopsignal=TERM
user=asterisk
redirect_stderr=true
stdout_logfile=/var/log/teams-sip-blf/sip-blf-sync.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=HOME="/opt/teams-sip-blf"

; Sample supervisord program for teams-sip-blf (sip-blf-sync).
;
; Install (pick one path for your distro):
;   RHEL/CentOS/Rocky:  /etc/supervisord.d/teams-sip-blf.ini
;   Debian/Ubuntu:      /etc/supervisor/conf.d/teams-sip-blf.conf
;
; Expected layout:
;   /opt/teams-sip-blf/
;     bin/sip-blf-sync              # release binary renamed from sip-blf-sync-linux-amd64
;     .env                          # copy from .env.example (chmod 600)
;     config/extensions.json
;     config/presence-state.json
;
; Then:
;   mkdir -p /var/log/teams-sip-blf
;   supervisorctl reread && supervisorctl update
;   supervisorctl start teams-sip-blf

; Boot delay: the wrapper waits until the host has been up for 300 seconds
; (5 minutes) before launching the app, so networking, Asterisk, etc. are ready.
; It's based on system uptime, so a crash restart or `supervisorctl restart`
; long after boot starts immediately. Change 300 below to adjust the delay.
; `exec` makes the app replace the shell so stop signals reach it directly.
[program:teams-sip-blf]
command=/bin/sh -c 'up=$(cut -d. -f1 /proc/uptime); [ "$up" -lt 300 ] && sleep $((300 - up)); exec /opt/teams-sip-blf/bin/sip-blf-sync'
directory=/opt/teams-sip-blf
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stopsignal=TERM
user=asterisk
redirect_stderr=true
stdout_logfile=/var/log/teams-sip-blf/sip-blf-sync.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=HOME="/opt/teams-sip-blf"
